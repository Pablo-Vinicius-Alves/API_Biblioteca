<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <header>
        <h1>Biblioteca Libraly</h1>
    </header>

    <form id="form-livro">
        <label for="titulo-livro">Título</label>
        <input type="text" id="titulo-livro" name="nome" required>

        <label for="autor-livro">Autor</label>
        <input type="text" id="autor-livro" name="autor" required>

        <label for="paginas-livro">Páginas</label>
        <input type="number" id="paginas-livro" name="paginas" min="1">

        <label for="status">Status</label>
        <select id="status" name="status">
            <option value="Pretendo ler">Pretendo ler</option>
            <option value="Lendo">Lendo</option>
            <option value="Finalizado">Finalizado</option>
        </select>

        <button type="submit">Adicionar Livro</button>
    </form>

    <main>
        <section>
            <h2>Pretendo ler</h2>
            <div id="lista-pretendo"></div>
        </section>

        <section>
            <h2>Lendo</h2>
            <div id="lista-lendo"></div>
        </section>

        <section>
            <h2>Finalizado</h2>
            <div id="lista-finalizado"></div>
        </section>
    </main>

    <script src="/app.js"></script>
</body>

</html>
