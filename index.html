<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Biblioteca Library</h1>
    </header>
    <form id="form-livro">
        <select id="status">
            <option value="Pretendo ler">Pretendo Ler</option>
            <option value="Lendo">Lendo</option>
            <option value="Finalizado">Finalizado</option>
        </select>
        <label for="titulo-livro">Titulo</label>
        <input type="text" id="titulo-livro">
        <label for="autor-livro">Autor</label>
        <input type="text" id="autor-livro">
        <label for="paginas-livro">Páginas</label>
        <input type="number" id="paginas-livro">
        <button type="submit">Adicionar Livro</button>
    </form>
    <div id="lista-livros"><h2>Listar livros</h2>
    </div>
    <footer>

    </footer>
    <script src="app.js"></script>
</body>

</html>
